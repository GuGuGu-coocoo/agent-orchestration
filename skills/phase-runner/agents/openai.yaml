interface:
  display_name: "Phase Runner"
  short_description: "Plan a Phase, run its Tasks, review it at Phase level"
  default_prompt: "Use $phase-runner to run the next roadmap Phase: plan it into bounded Tasks with machine-checkable verification, hand the whole Phase to run-phase.sh (one Task = one OpenCode session, no per-Task review), resolve any checkpoint or escalation, do the Phase-level integration review, then stop at awaiting_human_qa for the human."
